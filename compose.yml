version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aglabs-pe-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:7576:80"
    # networks:
    #   - aglabs-network
    environment:
      - TZ=UTC
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    # Read-only root filesystem for security
    read_only: true
    tmpfs:
      - /tmp
      - /run
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
