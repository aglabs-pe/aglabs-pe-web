# version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aglabs-pe-web
    ports:
      - "127.0.0.1:7099:7099"
    environment:
      NODE_ENV: production
      NPM_CONFIG_CACHE: /tmp/.npm
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cap_add:
      # - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256M"
        reservations:
          cpus: "0.5"
          memory: "128M"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7099"]
      interval: 30s
      timeout: 5s
      retries: 3